name: Auto-update Homebridge version

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: homebridge-image-update
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch latest Docker Hub tag
        id: docker_hub
        run: |
          set -euo pipefail
          LATEST=$(curl -fsS "https://hub.docker.com/v2/repositories/homebridge/homebridge/tags/?page_size=100&ordering=last_updated" |
            jq -r '.results[].name' |
            grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' |
            sort |
            tail -1)
          if [ -z "${LATEST}" ]; then
            echo "Docker Hub returned no dated Homebridge image tags" >&2
            exit 1
          fi
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Check for Homebridge version change
        id: check
        env:
          LATEST: ${{ steps.docker_hub.outputs.latest }}
        run: |
          set -euo pipefail
          CURRENT=$(sed -n 's/^version: "\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)"$/\1/p' homebridge/config.yaml)
          if [ -z "${CURRENT}" ]; then
            echo "Could not read the pinned Homebridge version from homebridge/config.yaml" >&2
            exit 1
          fi
          if [ "${CURRENT}" = "${LATEST}" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Homebridge version
        if: steps.check.outputs.update == 'true'
        env:
          LATEST: ${{ steps.docker_hub.outputs.latest }}
        run: |
          set -euo pipefail
          sed -i "s/^version: \".*\"/version: \"${LATEST}\"/" homebridge/config.yaml

      - name: Commit, create, merge, and delete update PR
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.docker_hub.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="automation/homebridge-${LATEST}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git add homebridge/config.yaml
          git commit -m "Bump Homebridge to ${LATEST}"
          git push --set-upstream origin "${BRANCH}"
          PR_URL=$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${BRANCH}" \
            --title "Bump Homebridge to ${LATEST}" \
            --body "Updates the pinned Homebridge image version to ${LATEST}.")
          gh pr merge "${PR_URL}" --merge --delete-branch
